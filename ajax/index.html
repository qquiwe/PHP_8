<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Трекер особистих витрат (AJAX)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
    <h1>Трекер особистих витрат</h1>
</div>

<p class="balance" id="balance">Баланс: ...</p>

<div class="search-box">
    <label for="search">Пошук за категорією:</label>
    <input type="text" id="search" placeholder="Наприклад: Продукти">
</div>

<div id="message"></div>

<div id="results">Завантаження...</div>

<h2>Додати операцію</h2>
<form id="add-form">
    <label for="amount">Сума (грн, від'ємна = витрата)</label>
    <input type="number" step="0.01" id="amount" name="amount" required>

    <label for="category">Категорія</label>
    <input type="text" id="category" name="category" required>

    <label for="transaction_date">Дата</label>
    <input type="date" id="transaction_date" name="transaction_date" required>

    <button type="submit">Додати</button>
</form>

<script src="script.js"></script>
</body>
</html>
